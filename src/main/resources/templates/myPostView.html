<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 상세</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #222;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 1rem 2rem;
            position: relative;
        }
        .header-buttons {
            position: absolute;
            top: 1rem;
            right: 2rem;
        }
        .header-buttons a {
            color: white;
            text-decoration: none;
            margin-left: 1rem;
            padding: 0.5rem 1rem;
            background: #444;
            border-radius: 5px;
        }
        .header-buttons a:hover {
            background: #555;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            padding: 2rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid #333;
            padding-bottom: 0.5rem;
        }
        p {
            line-height: 1.6;
        }
        .action-buttons {
            text-align: right;
            margin-top: 2rem;
        }
        .action-buttons form,
        .action-buttons a {
            display: inline-block;
        }
        .action-buttons button,
        .action-buttons a {
            padding: 10px 20px;
            margin-left: 10px;
            background: #333;
            color: white;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
        }
        .action-buttons button:hover,
        .action-buttons a:hover {
            background: #555;
        }
    </style>
</head>
<body>
<header>
    <h1>게시글 상세</h1>
    <div class="header-buttons">
        <a th:href="@{/}">홈</a>
        <a th:href="@{/auth/logout}">로그아웃</a>
    </div>
</header>
<main>
    <h1 th:text="${post.title}">게시글 제목</h1>
    <p th:text="${post.body}">게시글 내용</p>
    <div class="action-buttons">
        <!-- 게시판 목록으로 가기 버튼 -->
        <a th:href="@{/post/list}">게시판 목록</a>
        <!-- 수정 버튼 -->
        <form th:action="@{/post/edit/{id}(id=${post.id})}" method="get">
            <button type="submit">수정</button>
        </form>
        <!-- 삭제 버튼 -->
        <form th:action="@{/post/delete/{id}(id=${post.id})}" method="post" onsubmit="return confirm('정말 삭제하시겠습니까?');">
            <button type="submit">삭제</button>
        </form>
    </div>
</main>
</body>
</html>
