<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판 목록</title>
    <style>
        /* 기존 스타일 그대로 유지 */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 1rem 2rem;
            position: relative;
        }
        .header-buttons {
            position: absolute;
            top: 1rem;
            right: 2rem;
        }
        .header-buttons a {
            color: white;
            text-decoration: none;
            margin-left: 1rem;
            padding: 0.5rem 1rem;
            background: #555;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }
        .header-buttons a:hover {
            background: #777;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            padding: 2rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #f9f9f9;
            color: #333;
            margin-bottom: 2rem;
        }
        th, td {
            padding: 10px;
            border: 1px solid #ccc;
            text-align: left;
        }
        th {
            background-color: #333;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f4f4f4;
        }
        tr:hover {
            background-color: #eaeaea;
        }
        .pagination {
            text-align: center;
            margin-top: 20px;
        }
        .pagination a {
            display: inline-block;
            padding: 10px 15px;
            margin: 0 5px;
            text-decoration: none;
            background: #333;
            color: white;
            border-radius: 5px;
        }
        .pagination a:hover {
            background: #555;
        }
        .pagination .active {
            background: #777;
            pointer-events: none;
        }
    </style>
</head>
<body>
<header>
    <h1>게시판 목록</h1>
    <div class="header-buttons">
        <a href="/">홈</a>
        <a href="/auth/logout">로그아웃</a>
    </div>
</header>
<main>
    <a href="/post/save">게시글 작성</a>
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>제목</th>
            <th>작성자</th>
            <th>작성일</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="post : ${postPage.content}">
            <td th:text="${post.id}"></td>
            <td>
                <a th:text="${post.title}" th:href="@{/post/view/{id}(id=${post.id})}"></a>
            </td>
            <td th:text="${post.member.loginId}"></td>
            <td th:text="${post.createdDt_P}"></td>
        </tr>
        </tbody>
    </table>

    <!-- 페이징 네비게이션 -->
    <div class="pagination">
        <a th:if="${postPage.hasPrevious()}"
           th:href="@{/post/list(page=${postPage.number - 1}, size=${postPage.size})}">이전</a>

        <span th:each="pageNumber : ${#numbers.sequence(0, postPage.totalPages - 1)}">
            <a th:class="${pageNumber == postPage.number ? 'active' : ''}"
               th:href="@{/post/list(page=${pageNumber}, size=${postPage.size})}"
               th:text="${pageNumber + 1}"></a>
        </span>

        <a th:if="${postPage.hasNext()}"
           th:href="@{/post/list(page=${postPage.number + 1}, size=${postPage.size})}">다음</a>
    </div>
</main>
</body>
</html>
