<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 상세</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #222;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 1rem 2rem;
            position: relative;
        }
        .header-buttons {
            position: absolute;
            top: 1rem;
            right: 2rem;
        }
        .header-buttons a {
            color: white;
            text-decoration: none;
            margin-left: 1rem;
            padding: 0.5rem 1rem;
            background: #444;
            border-radius: 5px;
        }
        .header-buttons a:hover {
            background: #555;
        }
        main {
            max-width: 800px;
            margin: 2rem auto;
            background: white;
            padding: 2rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1rem;
            border-bottom: 2px solid #333;
            padding-bottom: 0.5rem;
        }
        p {
            line-height: 1.6;
        }
        .action-buttons {
            text-align: right;
            margin-top: 2rem;
        }
        .action-buttons a {
            display: inline-block;
            padding: 10px 20px;
            margin-left: 10px;
            background: #333;
            color: white;
            border-radius: 5px;
            text-decoration: none;
            text-align: center;
        }
        .action-buttons a:hover {
            background: #555;
        }
    </style>
</head>
<body>
<header>
    <h1>게시글 상세</h1>
    <div class="header-buttons">
        <a href="/">홈</a>
        <a href="/auth/logout">로그아웃</a>
    </div>
</header>
<main>
    <!-- 비공개 글인지 확인 -->
    <div th:if="${isSecret}">
        <p class="secret-message">비밀글입니다.</p>
    </div>
    <div th:if="${!isSecret}">
        <h1 th:text="${post.title}">게시글 제목</h1>
        <p th:text="${post.body}">게시글 내용</p>
        <div class="action-buttons">

            <!-- 게시판 목록으로 가기 버튼 -->
            <a href="/post/list">게시판 목록</a>
        </div>
    </div>
</main>
</body>
</html>
