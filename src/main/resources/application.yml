spring:
  # 세션 관련 설정
  session:
    store-type: jdbc  # 세션 저장소를 JDBC로 지정
    jdbc:
      initialize-schema: never   # 기본값은 embedded DB일 때만 생성해줌
  datasource:
    url: jdbc:mysql://localhost:3306/boardProject
    username: "root"
    password: "0311"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
# ?? ?? ??
server:
  servlet:
    session:
      timeout: 30m   # 예: 세션 타임아웃 30분 (properties 에는 단위 없으면 초, yml은 접미사 가능)
  port: 8080