spring:
  datasource:
    url: jdbc:mysql://localhost:3306/login_db
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  # 세션 관련 설정
  session:
    store-type: jdbc  # 세션 저장소를 JDBC로 지정
    jdbc:
      initialize-schema: never   # 기본값은 embedded DB일 때만 생성해줌
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
# ?? ?? ??
server:
  port: 8080